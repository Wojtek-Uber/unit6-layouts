<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Semantic Layout Practice</title>
    <style>
      h1 {
        background-color: #f3cfcf;
      }
      #nav-list {
        list-style: none;
      }
      .heading {
        font-family: Arial, Helvetica, sans-serif;
      }
      nav ul li a {
        text-decoration: none;
      }
    </style>
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <header>
      <h1 class="heading">Website Title</h1>
      <nav>
        <ul id="nav-list">
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <aside>
        <h3 class="heading">Sidebar</h3>
        <p>Related information goes here.</p>
      </aside>

      <section>
        <h2 class="heading">Main Section</h2>
        <p>This is the main content area.</p>
        <ul id="section-list">
          <li><a href="#">Data</a></li>
          <li><a href="#">Info</a></li>
          <li><a href="#">Access</a></li>
        </ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Example Site</p>
      #
      <p>Contact</p>
    </footer>
  </body>
</html>

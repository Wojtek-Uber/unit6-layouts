<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Semantic Layout Practice</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Website Title</h1>
      <nav>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <aside>
        <h3>Sidebar</h3>
        <p>Related information goes here.</p>
      </aside>
      
      <section>
        <h2>Main Section</h2>
        <p>This is the main content area.</p>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Example Site</p>
    </footer>
  </body>
</html>
